# Wendi Light Sandboxie centrally managed policy.
# Installed ACL: SYSTEM/Administrators full control, Users read-only.
# Do not place provider secrets directly in this file.

[GlobalSettings]
FileRootPath=C:\ProgramData\Wendi\Sandbox\%USER%\%SANDBOX%
KeyRootPath=\REGISTRY\USER\WendiSandbox_%USER%_%SANDBOX%
IpcRootPath=\WendiSandbox\%USER%\%SANDBOX%\Session_%SESSION%

[PicoClawBox]
Enabled=y
ConfigLevel=10

# Protect host user data and harden process tokens/devices.
UsePrivacyMode=y
UseSecurityMode=y
DropAdminRights=y
BlockNetworkFiles=y

# PicoClaw is installed per user. It may read its binaries and configuration,
# but writes to this tree are redirected into the box.
NormalFilePath=%Local AppData%\Programs\wendi-chat-desktop
NormalFilePath=%Local AppData%\Programs\wendi-chat-desktop\*
NormalFilePath=%Local AppData%\WendiChat\PicoClaw
NormalFilePath=%Local AppData%\WendiChat\PicoClaw\*

# Never offer sandbox contents for automatic recovery into the host.
AutoRecover=n
NotifyStartRunAccessDenied=y

# Limit network access to the two PicoClaw runtime images. Loopback is needed
# for Electron -> Launcher and Launcher -> Gateway. DNS and web API access are
# enabled; enterprise-specific model endpoints on other ports must be added by
# IT as explicit rules.
ProcessGroup=<PicoClawRuntime>,picoclaw-launcher.exe,picoclaw.exe
NetworkAccess=<PicoClawRuntime>,Allow;Address=127.0.0.1;Protocol=Any
NetworkAccess=<PicoClawRuntime>,Allow;Address=::1;Protocol=Any
NetworkAccess=<PicoClawRuntime>,Allow;Port=53;Protocol=UDP
NetworkAccess=<PicoClawRuntime>,Allow;Port=80,443;Protocol=TCP
NetworkAccess=*,Block
