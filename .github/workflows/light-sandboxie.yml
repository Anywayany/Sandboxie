name: Light Sandboxie deployment validation

on:
  push:
    paths:
      - "LightSandboxie/**"
      - "Sandboxie/install/SbieSettings.ini"
      - ".github/workflows/light-sandboxie.yml"
  pull_request:
    paths:
      - "LightSandboxie/**"
      - "Sandboxie/install/SbieSettings.ini"
      - ".github/workflows/light-sandboxie.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Parse deployment scripts and policy
        shell: powershell
        run: .\LightSandboxie\packaging\Test-LightSandboxieSources.ps1
